# diLogger configuration — apply with:  dilcfg -f logger.conf /dev/ttyACM0
# Lines are "<key> [value]".  '#' or ';' start a comment.
# Queries alone are not sent in batch mode; use the TUI or -c for those.

baudrate 9600
stopbit 1
parity none
filemb 30
timestamp off
hexlog off
filenew on

# set the device clock from the host:
sync
